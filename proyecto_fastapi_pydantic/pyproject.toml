[project]
name = "proyecto-fastapi-pydantic"
version = "0.1.0"
description = "API REST Mecatrónica con FastAPI y Pydantic v2 para Monitoreo de Sensores"
authors = [
    {name = "Carlos Benítez", email = "carlos.benitez@fiuna.edu.py"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
ipykernel = ">=6.0.0"
