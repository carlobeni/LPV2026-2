[tool.poetry]
name = "proyecto-rest-scraping"
version = "0.1.0"
description = "Proyecto de ejemplo Semana 4: Adquisicion continua con REST APIs, Web Scraping y SQLite"
authors = ["Carlos Benitez <cbenitez@fiuna.edu.py>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
pandas = "^2.2.0"
rich = "^13.7.0"
jupyter = "^1.0.0"
ipykernel = "^6.29.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
