[project]
name = "proyecto-sqlite-asyncio"
version = "0.1.0"
description = "Sistema de Telemetría Mecatrónica con Asyncio y SQLite WAL Mode"
authors = [
    {name = "Carlos Benítez", email = "carlos.benitez@fiuna.edu.py"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.5.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
ipykernel = ">=6.0.0"

