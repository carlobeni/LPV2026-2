[tool.poetry]
name = "proyecto-github-nodal"
version = "0.1.0"
description = "Web Scraping de Repositorios GitHub, Validación con Pydantic, API REST con FastAPI y Visualización Nodal de Cambios"
authors = ["Carlos Maria Benitez Cardozo <carlos.benitez@fiuna.edu.py>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
sqlalchemy = "^2.0.28"
jinja2 = "^3.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
ipykernel = "^6.29.3"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
